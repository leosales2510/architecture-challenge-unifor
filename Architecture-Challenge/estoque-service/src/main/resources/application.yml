server:
  port: ${PORT:8082}

spring:
  application:
    name: estoque-service
  datasource:
    # Banco próprio do serviço (Database per Service). Em memória: reinicia limpo a cada execução.
    url: jdbc:h2:mem:estoque;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health
